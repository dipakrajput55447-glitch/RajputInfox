<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajput Info - Premium OSINT</title>
    <style>
        :root {
            --bg: #0F0F0F;
            --surface: #1A1A1A;
            --gold: #D4AF37;
            --text: #F5F5F5;
            --error: #E53935;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { font-size: 3rem; margin-top: 20px; margin-bottom: 10px; }
        h1 { color: var(--gold); font-size: 2.2rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        p.subtitle { font-size: 1rem; color: #aaa; margin-bottom: 30px; }
        
        .container { width: 100%; max-width: 600px; background: var(--surface); border: 1px solid #333; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #aaa; font-size: 1rem; font-weight: bold; cursor: pointer; padding: 10px; transition: 0.3s; }
        .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; background: var(--bg); border: 1px solid #444; border-radius: 8px; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--gold); }
        .search-btn { background: var(--gold); color: #000; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .search-btn:hover { background: #F5C842; transform: translateY(-2px); }
        .search-btn:disabled { background: #555; cursor: not-allowed; transform: none; }
        
        .result-box { background: var(--bg); border: 1px solid #333; border-radius: 10px; padding: 15px; text-align: left; display: none; margin-top: 20px; overflow-x: auto; }
        .result-box.active { display: block; }
        .result-box h3 { color: var(--gold); margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .data-row { margin-bottom: 8px; font-size: 0.95rem; }
        .data-label { color: #888; font-weight: bold; }
        .data-value { color: #fff; font-family: monospace; }
        .error-msg { color: var(--error); font-weight: bold; text-align: center; display: none; margin-top: 15px; }
        .error-msg.active { display: block; }
        .loading { color: var(--gold); display: none; margin-top: 15px; font-style: italic; }
        .loading.active { display: block; }
        
        .telegram-join { margin-top: 30px; display: inline-block; text-decoration: none; color: #000; background: var(--gold); padding: 12px 30px; border-radius: 30px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="logo">👑</div>
    <h1>Rajput Info</h1>
    <p class="subtitle">Premium OSINT & Intelligence Tool</p>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tg-id', this)">Telegram ID</button>
            <button class="tab-btn" onclick="switchTab('tg-user', this)">Username</button>
            <button class="tab-btn" onclick="switchTab('phone', this)">Phone Info</button>
        </div>

        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Enter Telegram ID (e.g. 1234567890)">
            <button class="search-btn" id="searchBtn" onclick="performSearch()">SEARCH</button>
        </div>

        <div class="loading" id="loading">Fetching intelligence data...</div>
        <div class="error-msg" id="errorMsg"></div>
        
        <div class="result-box" id="resultBox">
            <h3>Intelligence Report</h3>
            <div id="resultData"></div>
        </div>
    </div>

    <a href="https://t.me/AnonymouschatbotR" class="telegram-join" target="_blank">Join Telegram Channel</a>

    <script>
        let currentTab = 'tg-id';

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const input = document.getElementById('searchInput');
            if(tab === 'tg-id') input.placeholder = "Enter Telegram ID (e.g. 1234567890)";
            if(tab === 'tg-user') input.placeholder = "Enter Telegram Username (without @)";
            if(tab === 'phone') input.placeholder = "Enter Phone Number (e.g. +919876543210)";
            
            input.value = "";
            document.getElementById('resultBox').classList.remove('active');
            document.getElementById('errorMsg').classList.remove('active');
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return alert("Please enter a search query.");

            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const resultData = document.getElementById('resultData');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            loading.classList.add('active');
            resultBox.classList.remove('active');
            errorMsg.classList.remove('active');

            try {
                let finalData = {};

                if (currentTab === 'tg-id') {
                    // Telegram ID API
                    const res = await fetch(`https://osint.invalidayushh.workers.dev/tgv2?key=Rajput&q=${query}`);
                    const json = await res.json();
                    if(json.success && json.data) {
                        finalData = json.data.results || {};
                        finalData.Name = json.data._TARGET_ACQUIRED_?.OPERATIVE_NAME || "Unknown";
                    } else { throw new Error("No data found for this ID"); }
                    
                } else if (currentTab === 'tg-user') {
                    // Telegram Username -> ID -> Data API
                    const idRes = await fetch(`https://osint.invalidayushh.workers.dev/id?key=Rajput&q=${query}`);
                    const idJson = await idRes.json();
                    if(idJson.result && idJson.result.data && idJson.result.data.id) {
                        const fetchedId = idJson.result.data.id;
                        const res = await fetch(`https://osint.invalidayushh.workers.dev/tgv2?key=Rajput&q=${fetchedId}`);
                        const json = await res.json();
                        if(json.success && json.data) {
                            finalData = json.data.results || {};
                            finalData.Name = json.data._TARGET_ACQUIRED_?.OPERATIVE_NAME || "Unknown";
                        } else { throw new Error("Data not found for this Username"); }
                    } else { throw new Error("Username not found"); }
                    
                } else if (currentTab === 'phone') {
                    // DeepOSINT Phone API
                    const res = await fetch(`https://deeposint.felixrdx.xyz/api/developer/Cyb3rB4nn3r/?key=9c8c8ebe8355255bb2c4cd2e002476cf&query=${query}`);
                    const json = await res.json();
                    if(json.status && json.data) {
                        // Extract nested data for display
                        for(let key in json.data) {
                            if(json.data[key].records) {
                                finalData[`[${json.data[key].title || key}]`] = JSON.stringify(json.data[key].records);
                            }
                        }
                    } else { throw new Error("No records found for this phone number"); }
                }

                // Display Data
                resultData.innerHTML = "";
                for(let key in finalData) {
                    if(finalData[key]) {
                        resultData.innerHTML += `<div class="data-row"><span class="data-label">${key}:</span> <span class="data-value">${finalData[key]}</span></div>`;
                    }
                }
                resultBox.classList.add('active');

            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.add('active');
            } finally {
                btn.disabled = false;
                loading.classList.remove('active');
            }
        }
    </script>
</body>
</html>
